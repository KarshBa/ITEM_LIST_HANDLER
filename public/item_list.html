<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item List Search</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* small dropdown styling re-using theme */
    .search-wrap{ position:relative; max-width:480px; width:100%; }
    #suggestList{
      position:absolute; left:0; right:0; top:100%;
      background:#fff; border:1px solid #ccc; border-radius:var(--radius);
      max-height:240px; overflow-y:auto; z-index:10;
      box-shadow:0 2px 6px rgba(0,0,0,.12);
      display:none;
    }
    #suggestList li{
      padding:.45rem .6rem; cursor:pointer; font-size:.9rem;
      border-bottom:1px solid #f1f1f1;
    }
    #suggestList li:hover{ background:#f1f3f4; }
    #suggestList li:last-child{ border-bottom:none; }
    .muted{ color:#5f6368; font-size:.8rem; }
  </style>
</head>
<body>
<header><h1>Item List Search</h1></header>
<main>
  <div class="input-group flex" id="searchRow" style="align-items:flex-end;">
  <div class="search-wrap" style="flex:1;position:relative;">
    <label for="searchBox">Search (UPC / Brand / Description)</label>
    <input type="text" id="searchBox" placeholder="Type and hit Enter…" />
    <ul id="suggestList"></ul>
  </div>
  <!-- Sub-department filter -->
  <div style="min-width:220px;">
    <label for="subdeptSelect">Sub-department</label>
    <select id="subdeptSelect">
      <option value="">All</option>
    </select>
  </div>

  <button id="searchBtn">Search</button>
  <button id="exportBtn" class="success">Export CSV</button>
</div>
  <div class="page-info" id="resultInfo"></div>

  <table id="resultTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</main>

<script type="module" src="js/item_list.js"></script>
</body>
</html>
