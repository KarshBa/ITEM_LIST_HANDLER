<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Item List Search</title>
  <link rel="stylesheet" href="style.css?v=1.0.1" />
  <link rel="stylesheet" href="https://item-list-handler.onrender.com/shared/nav.css?v=1.0.0">
  <style>
    /* small dropdown styling re-using theme */
    .search-wrap{ position:relative; max-width:480px; width:100%; }
    #suggestList{
      position:absolute; left:0; right:0; top:100%;
      background:#fff; border:1px solid #ccc; border-radius:var(--radius);
      max-height:240px; overflow-y:auto; z-index:10;
      box-shadow:0 2px 6px rgba(0,0,0,.12);
      display:none;
    }
    #suggestList li{
      padding:.45rem .6rem; cursor:pointer; font-size:.9rem;
      border-bottom:1px solid #f1f1f1;
    }
    #suggestList li:hover{ background:#f1f3f4; }
    #suggestList li:last-child{ border-bottom:none; }
    .muted{ color:#5f6368; font-size:.8rem; }
  </style>
</head>
<body>
<header><h1>Item List Search</h1></header>
<main>
  <div class="flex" style="gap:.5rem;align-items:flex-end;margin-bottom:.5rem;">
  <div class="search-wrap">
    <input id="searchBox" type="text" placeholder="Search UPC / Brand / Description" style="width:100%;">
    <ul id="suggestions" class="suggest-list hidden"></ul>
  </div>

  <select id="subdeptSelect" style="max-width:220px;"></select>
  <button id="searchBtn">Search</button>
  <button id="exportBtn" class="success">Export CSV</button>
</div>

<!-- Bulk UPC exact -->
<div class="flex" style="gap:.5rem;align-items:flex-end;margin:.4rem 0 1rem;">
  <input id="bulkUPCBox" type="text" placeholder="Bulk UPCs (space/comma/newline)" style="flex:1;">
  <button id="bulkUPCBtn" class="secondary">Bulk UPC Search</button>
</div>
  <div class="page-info" id="resultInfo"></div>

  <table id="resultTable">
    <thead></thead>
    <tbody></tbody>
  </table>
</main>

<script type="module" src="js/item_list.js?v=1.0.4"></script>
<script src="https://item-list-handler.onrender.com/shared/nav.js?v=1.0.0"></script>
</body>
</html>
