<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scale PLU List</title>
  <link rel="stylesheet" href="style.css?v=1.0.2" />
  <link rel="stylesheet" href="https://item-list-handler.onrender.com/shared/nav.css?v=1.0.1">
</head>
<body>
  <header><h1>Scale PLU List</h1></header>

  <main class="plu-main">
    <section class="input-group no-print">
      <label for="pluSubdeptSelect">Sub-department</label>
      <div class="flex">
        <select id="pluSubdeptSelect">
          <option value="">All Sub Depts</option>
        </select>
        <button id="pluPrintBtn">Print</button>
      </div>
      <p id="pluInfo" class="muted">Loading PLUs…</p>
    </section>

    <section id="pluPrintArea" class="plu-print-area"></section>
  </main>

  <script src="js/plus.js?v=1.0.0"></script>
  <script src="https://item-list-handler.onrender.com/shared/nav.js?v=1.0.1"></script>
</body>
</html>
