<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Item List</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://item-list-handler.onrender.com/shared/nav.css?v=1.0.1">
</head>
<body>
  <header><h1>Master Item List Upload</h1></header>
  <main>
    <section class="input-group">
      <label for="csv">Upload new item_list.csv</label>
      <div class="flex">
        <input type="file" id="csv" accept=".csv,.xlsb" />
        <button id="uploadBtn" disabled>Upload</button>
        <span id="uploadStatus" class="muted" style="display:none;margin-left:.5rem;">Processing…</span>
      </div>
    </section>

    <section id="info" class="input-group">
      <strong>Last upload:</strong> <span id="uploadedAt">–</span><br />
      <strong>Total items:</strong> <span id="count">–</span>
    </section>
<div class="flex">
  <button id="prevBtn" class="secondary" disabled>Prev</button>
  <button id="nextBtn" class="secondary">Next</button>
  <button id="refreshBtn" class="secondary">Refresh Items</button>
  <button id="downloadBtn" class="success">Download CSV</button>
</div>
<!-- new standalone line, full-width, flush left -->
<div id="pageInfo" class="page-info"></div>
    <table id="itemsTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </main>
<script>
/* ---------- pagination state ---------- */
let page = 1;
const pageSize = 200;   // adjust to taste

/* ---------- helpers ---------- */
function renderMetadata({ uploadedAt, total, count }) {
  // pick whichever row-count field is present
  const rows = total ?? count ?? 0;
  if (uploadedAt !== undefined) {
    document.getElementById('uploadedAt').textContent =
      uploadedAt ? new Date(uploadedAt).toLocaleString() : 'Never';
  }
  document.getElementById('count').textContent = rows;
 }

/* ---------- upload UI state ---------- */
const fileInput = document.getElementById('csv');
const uploadBtn = document.getElementById('uploadBtn');
const uploadStatus = document.getElementById('uploadStatus');

function isAllowedUploadFile(file) {
  if (!file) return false;
  const name = String(file.name || '').trim().toLowerCase();
  return name.endsWith('.csv') || name.endsWith('.xlsb');
}

function setUploading(isUploading) {
  if (isUploading) {
    uploadBtn.disabled = true;
    uploadBtn.dataset.prevText = uploadBtn.textContent;
    uploadBtn.textContent = 'Uploading…';
    if (uploadStatus) uploadStatus.style.display = '';
  } else {
    uploadBtn.textContent = uploadBtn.dataset.prevText || 'Upload';
    if (uploadStatus) uploadStatus.style.display = 'none';
  }
}

// initial state
uploadBtn.disabled = true;

// enable Upload only when valid file chosen
fileInput.addEventListener('change', () => {
  const file = fileInput.files?.[0];
  const ok = isAllowedUploadFile(file);
  uploadBtn.disabled = !ok;

  // Optional: if someone picks a wrong file type, be explicit
  if (file && !ok) alert('Only .csv or .xlsb files are accepted.');
});

  
/* ---------- load one page ---------- */
async function loadPage(p = 1) {
  const res = await fetch(`/api/items?page=${p}&pageSize=${pageSize}`);
  if (!res.ok) return;

  const { rows, total } = await res.json();
  renderMetadata({ total });      // keep existing uploadedAt

  const thead = document.querySelector('#itemsTable thead');
  const tbody = document.querySelector('#itemsTable tbody');
  thead.innerHTML = tbody.innerHTML = '';

  if (!rows.length) return;

  /* header */
  const keys = Object.keys(rows[0]);
  thead.innerHTML =
    '<tr>' + keys.map(k => `<th>${k}</th>`).join('') + '</tr>';

  /* body */
  rows.forEach(r => {
    const tr = document.createElement('tr');
    keys.forEach(k =>
      tr.insertAdjacentHTML(
        'beforeend',
        `<td data-label="${k}">${r[k]}</td>`
      )
    );
    tbody.appendChild(tr);
  });

  /* nav button state */
  document.getElementById('prevBtn').disabled = p === 1;
  document.getElementById('nextBtn').disabled = p * pageSize >= total;
  /* page indicator */
  const pages = Math.max(1, Math.ceil(total / pageSize));
  document.getElementById('pageInfo').textContent = `Page ${p} / ${pages}`;
  page = p;
}

/* ---------- button handlers ---------- */
document.getElementById('prevBtn').onclick = () => loadPage(page - 1);
document.getElementById('nextBtn').onclick = () => loadPage(page + 1);

/* ---------- upload handler ---------- */
document.getElementById('uploadBtn').addEventListener('click', async () => {
  const file = fileInput.files?.[0];
  if (!isAllowedUploadFile(file)) return;

  setUploading(true);

  try {
    const fd = new FormData();
    fd.append('csv', file);

    const res = await fetch('/upload', { method: 'POST', body: fd });

    if (!res.ok) throw new Error('Upload failed');

    const meta = await res.json();   // { uploadedAt, count } etc.
    renderMetadata(meta);
    await loadPage(1);

  } catch (e) {
    alert(e.message || 'Upload failed');
  } finally {
    setUploading(false);

    // require choosing a new file before enabling Upload again
    if (fileInput) fileInput.value = '';
    uploadBtn.disabled = true;
  }
});

document.getElementById('refreshBtn').onclick = async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';

  const res = await fetch('/api/sync-items', { method: 'POST' });
  const { success } = await res.json();

  if (success) {
    alert('Item list updated!');
    await loadPage(page);         // reload current page with fresh data
  } else {
    alert('Refresh failed – master server may be down.');
  }

  btn.disabled = false;
  btn.textContent = 'Refresh Items';
};

  document.getElementById('downloadBtn').onclick = () => {
  // Let the server set the correct filename; just navigate.
  window.location.href = '/api/download-items';
};
  
/* ---------- initial load ---------- */
fetch('/api/metadata').then(r => r.ok && r.json().then(renderMetadata));
loadPage(1);
</script>
<script src="https://item-list-handler.onrender.com/shared/nav.js?v=1.0.1"></script>
</body>
</html>
